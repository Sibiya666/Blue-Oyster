[project]
name = "blue-oyster"
version = "0.1.0"
description = "Бармен — Discord-бот на Hermes Agent: роли по реакциям"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "Pillow>=10"]
screenshots = [
    "Pillow>=10",
    "rapidocr==3.10.0",
    "onnxruntime>=1.20.1,<2",
    "opencv-python-headless>=4.5.1.48,<5",
    "numpy>=1.26,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["barman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
